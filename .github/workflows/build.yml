name: Build 26AnimSafe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make git bash fakeroot dpkg-dev libxml2
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Clone Theos
        run: git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Fetch iOS SDK
        run: |
          # theos/sdks ships SDKs as GitHub Release assets, NOT as raw/master files.
          curl -sL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz -o /tmp/sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks"

      - name: Fetch iOS toolchain
        run: |
          # theos on Linux needs the iOS clang/ldid toolchain (not bundled, not auto-downloaded).
          # Source: theos bin/install-theos -> L1ghtmann/llvm-project release.
          # ubuntu-latest (24.04) only ships libtinfo.so.6; the toolchain's clang wants .so.5.
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          mkdir -p "$THEOS/toolchain"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$THEOS/toolchain"

      - name: Build (rootless, arm64)
        run: make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: 26animsafe-deb
          path: packages/*.deb
